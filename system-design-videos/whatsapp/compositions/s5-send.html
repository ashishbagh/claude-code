<template>
  <style>
    #root { position: absolute; inset: 0; }
    #s5-chat { top: 440px; }
    .s5-note { position: absolute; right: 72px; top: 590px; padding: 10px 24px; border-radius: 22px; background: rgba(13, 17, 33, 0.86); color: var(--ink); font: 800 42px var(--font);
      text-align: right; opacity: 0; z-index: 5; }
    .s5-note em { font-style: normal; color: var(--yellow); }
  </style>
  <div id="root" data-composition-id="s5-send" data-width="1080" data-height="1920"
       data-composition-variables='[{"id":"T","type":"number","label":"Scene length (s)","default":21},{"id":"S","type":"number","label":"Narration length (s)","default":20.4}]'>
    <canvas id="s5-canvas" class="lc-fill"></canvas>
    <div class="v-vignette"></div>
    <div class="v-top"><span class="lc-badge">Send a message</span><span class="v-name">Design WhatsApp</span></div>
    <div class="v-chat" id="s5-chat">
      <div class="v-bubble" id="s5-b1">Hi! 👋 <small>10:42</small><span class="v-ticks" data-layout-allow-overlap><span class="t1" id="s5-tk1">✓</span><span class="t2" id="s5-tk2">✓</span></span></div>
    </div>
    <div class="s5-note" id="s5-n1"><em>✓</em> saved on server = sent</div>
    <div class="s5-note" id="s5-n2"><em>✓✓</em> reached Rahul = delivered</div>
  </div>
  <script>
    (function () {
      const { T, S = T } = window.__hyperframes.getVariables();
      const tl = gsap.timeline({ paused: true });
      const A = ChatArch(document.getElementById("s5-canvas"));
      const at = (f) => f * S;
      const G = "#22c55e", B = "#38bdf8", Y = "#facc15";
      const hops = [
        ["priya", "lb", at(0.04), 0.9, "Hi!", G], ["lb", "chatA", at(0.04) + 0.9, 0.8, "Hi!", G],
        ["chatA", "db", at(0.24), 1.0, "save", G],
        ["db", "chatA", at(0.33), 0.6, null, G], ["chatA", "priya", at(0.36), 0.8, "✓ sent", Y],
        ["chatA", "session", at(0.44), 0.8, "Rahul?", B], ["session", "chatA", at(0.53), 0.7, "server B", Y],
        ["chatA", "chatB", at(0.60), 0.8, "Hi!", G], ["chatB", "rahul", at(0.64) + 0.2, 0.9, "Hi!", G],
        ["rahul", "chatB", at(0.75), 0.8, "ack", B], ["chatB", "chatA", at(0.75) + 0.8, 0.7, null, B],
        ["chatA", "priya", at(0.84) + 0.3, 0.9, "✓✓", Y],
      ];
      tl.fromTo("#s5-b1", { opacity: 0, y: 40, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(2)" }, at(0.03));
      tl.fromTo("#s5-tk1", { opacity: 0, scale: 2 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3)" }, at(0.36) + 0.8);
      tl.fromTo("#s5-n1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35 }, at(0.37));
      tl.to("#s5-n1", { opacity: 0, duration: 0.25 }, at(0.82));
      tl.fromTo("#s5-tk2", { opacity: 0, scale: 2 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3)" }, at(0.84) + 1.2);
      tl.fromTo("#s5-n2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35 }, at(0.84) + 1.2);
      LC.drive(tl, T, (t) => {
        // camera follows the message: Priya -> server A / storage -> session -> Rahul -> wide
        const k1 = LC.prog(t, at(0.10), 1.5), k2 = LC.prog(t, at(0.42), 1.2), k3 = LC.prog(t, at(0.60), 1.2), k4 = LC.prog(t, at(0.86), 1.2);
        const tx = -1.6 * k1 + 1.6 * k2 + 1.4 * k3 - 1.4 * k4;
        const tz = -4.6 + 4.4 * k1 - 1.4 * k2 - 3.0 * k3 + 2.6 * k4;
        A.draw({
          appear: A.base(), packets: SD.hop(t, hops), hot: SD.lit(t, hops), glow: SD.glowFrom(t, hops),
          target: [tx, 0, tz], dist: 14.5 + 2.5 * k4, elev: 0.95, orbit: 0.12 * Math.sin(t * 0.3),
        });
      });
      window.__timelines["s5-send"] = tl;
    })();
  </script>
</template>
