<template>
  <style>
    #root { position: absolute; inset: 0; }

  </style>
  <div id="root" data-composition-id="s5-walk3" data-width="1920" data-height="1080"
       data-composition-variables='[{"id":"T","type":"number","label":"Scene length (s)","default":11},{"id":"S","type":"number","label":"Narration length (s)","default":10.4}]'>
    <canvas id="s5-walk3-canvas" class="lc-fill"></canvas>
    <div class="lc-header"><span class="lc-badge">LeetCode 704</span><span class="lc-title">Binary Search</span><span class="lc-diff lc-easy">Easy</span></div>
    <div class="bs-target" id="s5-walk3-target" style="opacity:1"><span>target = <code>23</code></span></div>
    <div class="lc-panel bs-cmp" id="s5-walk3-cmp">
      <div class="bs-line" id="s5-walk3-l1"><span class="lo">lo=5</span>  <span class="hi">hi=6</span>  <span class="mid">mid=5</span></div>
      <div class="bs-line" id="s5-walk3-l2">nums[5] = 23 == 23</div>
      <div class="bs-go bs-hit" id="s5-walk3-go">✓ found · return 5</div>
    </div>
    <div class="lc-panel bs-count" id="s5-walk3-count"><div class="lc-label">Comparisons</div><div class="lc-value"><span id="s5-walk3-v0">2</span><span id="s5-walk3-v1">3</span></div></div>
    <div class="bs-note" id="s5-walk3-note">3 checks · linear search needs 6</div>
  </div>
  <script>
    (function () {
      const { T, S = T } = window.__hyperframes.getVariables();
      const tl = gsap.timeline({ paused: true });
      const fade = (sel, at, from = { y: 24 }) => tl.fromTo(sel, { opacity: 0, ...from }, { opacity: 1, x: 0, y: 0, duration: 0.45, ease: "power3.out" }, at);
      const arr = Arr(document.getElementById("s5-walk3-canvas"));
      LC.values(tl, [["#s5-walk3-v0", 0 * S], ["#s5-walk3-v1", 0.27 * S]]);
      fade("#s5-walk3-l1", 0.07 * S); fade("#s5-walk3-l2", 0.27 * S); fade("#s5-walk3-go", 0.46 * S, { scale: 0.85 });
      fade("#s5-walk3-note", 0.68 * S);
      LC.drive(tl, T, (t) => {
        const lo = 5, hi = 6, mid = t > 0.12 * S ? 5 : null;
        const midK = LC.prog(t, 0.12 * S, 0.4), found = LC.prog(t, 0.46 * S, 0.6);
        arr.draw({ lo, hi, mid, midK, alive: (i) => (i === 5 || i === 6 ? 1 : 0), found, orbit: 0.08 * Math.sin((t / T) * Math.PI) });
      });
      window.__timelines["s5-walk3"] = tl;
    })();
  </script>
</template>
