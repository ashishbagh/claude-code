<template>
  <style>
    #root { position: absolute; inset: 0; }
    .lc-title { font-size: 36px; }
    #s3-walk1-best { left: 1250px; top: 200px; width: 470px; height: 210px; }
    #s3-walk1-last { left: 1250px; top: 440px; width: 470px; height: 450px; }
    #s3-walk1-last .lc-list { gap: 8px; }
  </style>
  <div id="root" data-composition-id="s3-walk1" data-width="1920" data-height="1080"
       data-composition-variables='[{"id":"T","type":"number","label":"Scene length (s)","default":17},{"id":"S","type":"number","label":"Narration length (s)","default":16.3}]'>
    <canvas id="s3-walk1-canvas" class="lc-fill"></canvas>
    <div class="lc-header"><span class="lc-badge">LeetCode 3</span><span class="lc-title">Longest Substring Without Repeating Characters</span><span class="lc-diff lc-medium">Medium</span></div>
    <div class="lc-panel" id="s3-walk1-best"><div class="lc-label">Best length</div><div class="lc-value"><span id="s3-walk1-v0">0</span><span id="s3-walk1-v1">1</span><span id="s3-walk1-v2">2</span></div></div>
    <div class="lc-panel" id="s3-walk1-last"><div class="lc-label">last[ch] = index</div><div class="lc-list"><div class="lc-item" id="s3-walk1-i0">p → 0</div><div class="lc-item" id="s3-walk1-i1">w → 1</div></div></div>
    <div class="lc-caption" id="s3-walk1-cap1"><span>right = 0:  'p' is new  →  window "p", length 1</span></div>
    <div class="lc-caption" id="s3-walk1-cap2"><span>right = 1:  'w' is new  →  window "pw", best = 2</span></div>
  </div>
  <script>
    (function () {
      const { T, S = T } = window.__hyperframes.getVariables();
      const tl = gsap.timeline({ paused: true });
      const win = Win(document.getElementById("s3-walk1-canvas"));
      LC.values(tl, [["#s3-walk1-v0", 0 * S], ["#s3-walk1-v1", 0.18 * S], ["#s3-walk1-v2", 0.85 * S]]);
      LC.listItems(tl, [["#s3-walk1-i0", 0.16 * S], ["#s3-walk1-i1", 0.5 * S]]);
      LC.captions(tl, T, [["#s3-walk1-cap1", 0.05 * S / T], ["#s3-walk1-cap2", 0.5 * S / T]]);
      LC.drive(tl, T, (t) => {
        const R = t < 0.16 * S ? -1 : Win.track(t, [[0, 0], [0.5 * S, 1]]);
        win.draw({ L: 0, R, orbit: 0.08 * Math.sin((t / T) * Math.PI) });
      });
      window.__timelines["s3-walk1"] = tl;
    })();
  </script>
</template>
