<template>
  <style>
    #root { position: absolute; inset: 0; }
  </style>
  <div id="root" data-composition-id="s5-walk3" data-width="1920" data-height="1080"
       data-composition-variables='[{"id":"T","type":"number","label":"Scene length (s)","default":19},{"id":"S","type":"number","label":"Narration length (s)","default":18.4}]'>
    <canvas id="s5-walk3-canvas" class="lc-fill"></canvas>
    <div class="lc-header"><span class="lc-badge">LeetCode 875</span><span class="lc-title">Koko Eating Bananas</span><span class="lc-diff lc-medium">Medium</span></div>
    <div class="kk-h" id="s5-walk3-h" style="opacity:1"><span>h = 8 hours</span></div>
    <div class="kk-line" id="s5-walk3-line"><div class="kk-range" id="s5-walk3-range"></div><div class="kk-cells"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span><span>11</span></div>
      <div class="kk-k" id="s5-walk3-k">k<i></i></div></div>
    <div class="kk-stack">
      <div class="lc-panel" id="s5-walk3-p1" style="opacity:1">
        <div class="kk-l" id="s5-walk3-p1l">k = <b>5</b> → hours 1+2+2+3 = <b>8</b></div>
        <div class="kk-chip kk-ok" id="s5-walk3-p1c">8 ≤ 8 ✓ works → hi = 5</div>
      </div>
      <div class="lc-panel" id="s5-walk3-p2" style="opacity:0">
        <div class="kk-l" id="s5-walk3-p2l">k = <b>4</b> → hours 1+2+2+3 = <b>8</b></div>
        <div class="kk-chip kk-ok" id="s5-walk3-p2c">8 ≤ 8 ✓ works → hi = 4</div>
      </div>
      <div class="lc-panel" id="s5-walk3-p3" style="opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px">
        <div class="kk-l" style="opacity:1">lo = hi = <b>4</b></div>
        <div class="kk-chip kk-ans" id="s5-walk3-ans" style="opacity:1">Answer: 4 bananas / hour</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const { T, S = T } = window.__hyperframes.getVariables();
      const tl = gsap.timeline({ paused: true });
      const fade = (sel, at, from = { y: 24 }) => tl.fromTo(sel, { opacity: 0, ...from }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.45, ease: "power3.out" }, at);
      const piles = Piles(document.getElementById("s5-walk3-canvas"));
      tl.fromTo("#s5-walk3-line", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.05);
      const CW = 85, rng = document.getElementById("s5-walk3-range"), kEl = document.getElementById("s5-walk3-k");
      const setLine = (lo, hi, k, kA) => {
        rng.style.transform = `translateX(${(lo - 1) * CW}px) scaleX(${hi - lo + 1})`;
        rng.style.borderWidth = `3px ${3 / (hi - lo + 1)}px`;
        kEl.style.transform = `translateX(${(k - 1) * CW}px)`; kEl.style.opacity = kA;
      };
      const Arr = (t, st) => { let v = st[0][1]; for (let i = 1; i < st.length; i++) if (t >= st[i][0]) v = v + (st[i][1] - v) * LC.prog(t, st[i][0], 0.5); return v; };
      fade("#s5-walk3-p1l", 0.09 * S); fade("#s5-walk3-p1c", 0.3 * S, { scale: 0.85 });
      tl.to("#s5-walk3-p1", { opacity: 0, duration: 0.3 }, 0.44 * S);
      fade("#s5-walk3-p2", 0.44 * S); fade("#s5-walk3-p2l", 0.46 * S); fade("#s5-walk3-p2c", 0.6 * S, { scale: 0.85 });
      tl.to("#s5-walk3-p2", { opacity: 0, duration: 0.3 }, 0.71 * S);
      fade("#s5-walk3-p3", 0.71 * S, { scale: 0.9 });
      tl.fromTo("#s5-walk3-ans", { scale: 1 }, { scale: 1.08, duration: 0.25, yoyo: true, repeat: 1, ease: "power1.inOut" }, 0.85 * S);
      LC.drive(tl, T, (t) => {
        const k = t < 0.44 * S ? 5 : 4;
        const lo = 4, hi = Arr(t, [[0, 6], [0.34 * S, 5], [0.62 * S, 4]]);
        setLine(lo, hi, k, 1);
        const kK = k === 5 ? LC.prog(t, 0.09 * S, 0.7) : LC.prog(t, 0.46 * S, 0.7);
        piles.draw({ k, kK, orbit: 0.08 * Math.sin((t / T) * Math.PI) });
      });
      window.__timelines["s5-walk3"] = tl;
    })();
  </script>
</template>
