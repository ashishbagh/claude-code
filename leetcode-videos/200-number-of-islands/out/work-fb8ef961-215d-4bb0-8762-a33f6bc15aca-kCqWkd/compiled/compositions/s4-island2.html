<template>
  <style>
    #root { position: absolute; inset: 0; }
    #s4-island2-count { left: 1250px; top: 200px; width: 460px; height: 210px; }
    #s4-island2-calls { left: 1250px; top: 440px; width: 460px; height: 420px; }
  </style>
  <div id="root" data-composition-id="s4-island2" data-width="1920" data-height="1080"
       data-composition-variables='[{"id":"T","type":"number","label":"Scene length (s)","default":15.6}]'>
    <canvas id="s4-island2-canvas" class="lc-fill"></canvas>
    <div class="lc-header"><span class="lc-badge">LeetCode 200</span><span class="lc-title">Number of Islands</span><span class="lc-diff lc-medium">Medium</span></div>
    <div class="lc-panel" id="s4-island2-count">
      <div class="lc-label">Islands</div>
      <div class="lc-value"><span id="s4-island2-v1">1</span><span id="s4-island2-v2">2</span></div>
    </div>
    <div class="lc-panel" id="s4-island2-calls">
      <div class="lc-label">DFS calls</div>
      <div class="lc-list"><div class="lc-item" id="s4-island2-call0">dfs(2, 2)</div></div>
    </div>
    <div class="lc-caption" id="s4-island2-cap1"><span>Water and sunk cells are skipped</span></div>
    <div class="lc-caption" id="s4-island2-cap2"><span>Fresh land at (2, 2)  →  count = 2</span></div>
    <div class="lc-caption" id="s4-island2-cap3"><span>No land neighbours  →  DFS stops</span></div>
  </div>
  <script>
    (function () {
      const { T } = window.__hyperframes.getVariables();
      const grid = IslandGrid(document.getElementById("s4-island2-canvas"));
      const tl = gsap.timeline({ paused: true });
      const ORDER = IslandGrid.ORDER;
      const FOUND = 0.5 * T, SINK = 0.66 * T, STEP = 0.12 * T;
      LC.values(tl, [["#s4-island2-v1", 0], ["#s4-island2-v2", FOUND]]);
      LC.listItems(tl, [["#s4-island2-call0", SINK + 0 * STEP]]);
      LC.captions(tl, T, [["#s4-island2-cap1", 0.05], ["#s4-island2-cap2", 0.5], ["#s4-island2-cap3", 0.66]]);
      LC.drive(tl, T, (t) => {
        const sunk = {};
        for (let i = 0; i < 1; i++) IslandGrid.ISLANDS[i].forEach(([r, c]) => (sunk[r + "," + c] = [i, 1]));
        const { dfs } = IslandGrid.sink(t, sunk, 1, SINK, STEP);
        const path = ORDER.slice(1, 13);
        const scan = path[LC.stepAt(t, 0.08 * T, 0.48 * T, path.length)], scanAlpha = 1;
        grid.draw({ sunk, scan, scanAlpha, dfs, orbit: 0.12 * Math.sin((t / T) * Math.PI) });
      });
      window.__timelines["s4-island2"] = tl;
    })();
  </script>
</template>
