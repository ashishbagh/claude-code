<template>
  <style>
    #root { position: absolute; inset: 0; }
  </style>
  <div id="root" data-composition-id="s3-walk1" data-width="1920" data-height="1080"
       data-composition-variables='[{"id":"T","type":"number","label":"Scene length (s)","default":18.4},{"id":"S","type":"number","label":"Narration length (s)","default":17.799999999999997}]'>
    <canvas id="s3-canvas" class="lc-fill"></canvas>
    <div class="lc-header"><span class="lc-badge">LeetCode 152</span><span class="lc-title">Maximum Product Subarray</span><span class="lc-diff lc-medium">Medium</span></div>
    <div class="mp-vals" id="s3-vals">
      <div class="mp-box mp-max" id="s3-bmax"><h4>MAX</h4><div class="lc-value" id="s3-vmax"></div></div>
      <div class="mp-box mp-min" id="s3-bmin"><h4>MIN</h4><div class="lc-value" id="s3-vmin"></div></div>
      <div class="mp-box mp-ans" id="s3-bans"><h4>ANS</h4><div class="lc-value" id="s3-vans"></div></div>
    </div>
    <div class="mp-calc"><div class="lc-panel" id="s3-p" style="opacity:1">
      <div class="mp-l" id="s3-l1">x = <b>2</b> → max = min = ans = 2</div>
      <div class="mp-l" id="s3-l2">x = <b>3</b> → 3, 3×2, 3×2</div>
      <div class="mp-l" id="s3-l3"><span class="g">max 6</span> · <span class="r">min 3</span> · <b>ans 6</b></div>
    </div></div>
  </div>
  <script>
    (function () {
      const { T, S = T } = window.__hyperframes.getVariables();
      const tl = gsap.timeline({ paused: true });
      const fade = (sel, at, from = { y: 24 }) => tl.fromTo(sel, { opacity: 0, ...from }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.45, ease: "power3.out" }, at);
      const row = Row(document.getElementById("s3-canvas"));
      ["#s3-bmax", "#s3-bmin", "#s3-bans"].forEach((s, i) => fade(s, 0.03 * S + i * 0.12, { y: 30 }));
      Row.vals(tl, "#s3-vmax", null, [["2", 0.12 * S], ["6", 0.57 * S]]);
      Row.vals(tl, "#s3-vmin", null, [["2", 0.12 * S], ["3", 0.64 * S]]);
      Row.vals(tl, "#s3-vans", null, [["2", 0.12 * S], ["6", 0.71 * S]]);
      fade("#s3-l1", 0.12 * S); fade("#s3-l2", 0.39 * S); fade("#s3-l3", 0.57 * S);
      LC.drive(tl, T, (t) => row.draw({
        cur: Row.track(t, [[0, 0], [0.28 * S, 1]]),
        seen: (i) => (i === 0 ? LC.prog(t, 0.05 * S, 0.4) : i === 1 ? LC.prog(t, 0.39 * S, 0.4) : 0),
        best: t < 0.12 * S ? null : t < 0.71 * S ? [0, 0] : [0, 1], bestK: t < 0.71 * S ? LC.prog(t, 0.12 * S, 0.4) : 1,
        orbit: 0.08 * Math.sin((t / T) * Math.PI) }));
      window.__timelines["s3-walk1"] = tl;
    })();
  </script>
</template>
