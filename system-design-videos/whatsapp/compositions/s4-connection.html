<template>
  <style>
    #root { position: absolute; inset: 0; }

  </style>
  <div id="root" data-composition-id="s4-connection" data-width="1080" data-height="1920"
       data-composition-variables='[{"id":"T","type":"number","label":"Scene length (s)","default":21.3},{"id":"S","type":"number","label":"Narration length (s)","default":20.7}]'>
    <div id="s4-flow"></div>
    <div class="v-top"><span class="lc-badge">Real-time connection</span>
      <div class="v-route" id="s4-route"><span class="v-step">📱 Phone</span><b>→</b><span class="v-step">⚖️ LB</span><b>→</b><span class="v-step">🖥 Server</span><b>→</b><span class="v-step">🗺 Redis</span></div></div>
    <div class="v-kicker" id="s4-k1" style="top:450px"><span style="color:#f87171">✗</span> HTTP polling<small>"Koi naya message?" … again and again</small></div>
    <div class="v-kicker" id="s4-k2" style="top:450px"><em>WebSocket</em> ✓<small>One connection, always open · server pushes</small></div>

  </div>
  <script>
    (function () {
      const { T, S = T } = window.__hyperframes.getVariables();
      const tl = gsap.timeline({ paused: true });
      const F = WaFlow(document.getElementById("s4-flow"), "core", ["priya", "rahul", "lb", "chatA", "chatB", "session"]);
      const at = (f) => f * S;
      LC.route(tl, "#s4-route", [[0, 0], [at(0.48), 1], [at(0.55), 2], [at(0.78), 3]]);

        ["priya", "lb", 0.3, 0.55, "new?", R, 0.1], ["priya", "lb", 0.95, 0.55, "new?", R, 0.1], ["priya", "lb", 1.6, 0.55, "new?", R, 0.1],

        ["priya", "lb", at(0.15), 0.9, "WebSocket", G, OPEN], ["lb", "priya", at(0.36), 0.9, "push", G, 0.6],
        ["lb", "chatA", at(0.55), 0.8, "Priya", G, OPEN],
        ["rahul", "lb", at(0.67), 0.7, "WebSocket", G, OPEN], ["lb", "chatB", at(0.67) + 0.7, 0.7, "Rahul", G, OPEN],

        appear: { priya: LC.prog(t, 0, 0.4), lb: LC.prog(t, 0.1, 0.4), rahul: LC.prog(t, at(0.62), 0.5),

        hops,
      }));
      window.__timelines["s4-connection"] = tl;
    })();
