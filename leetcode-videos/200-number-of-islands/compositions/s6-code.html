  <div id="root" data-composition-id="s6-code" data-width="1920" data-height="1080"
       data-composition-variables='[{"id":"T","type":"number","label":"Scene length (s)","default":19}]'>
    <div class="lc-header"><span class="lc-badge">LeetCode 200</span><span class="lc-title">Number of Islands</span><span class="lc-diff lc-medium">Medium</span></div>
    <div class="lc-code" id="s6-panel" data-hold><pre><div class="lc-hl" id="s6-hl"></div><span class="k">def</span> <span class="f">numIslands</span>(grid):
    m, n = <span class="f">len</span>(grid), <span class="f">len</span>(grid[<span class="n">0</span>])
    count = <span class="n">0</span>

    <span class="k">def</span> <span class="f">dfs</span>(r, c):
        <span class="k">if</span> r &lt; <span class="n">0</span> <span class="k">or</span> r &gt;= m <span class="k">or</span> c &lt; <span class="n">0</span> <span class="k">or</span> c &gt;= n \
           <span class="k">or</span> grid[r][c] == <span class="s">"0"</span>:
            <span class="k">return</span>
        grid[r][c] = <span class="s">"0"</span>            <span class="c"># sink it</span>
        <span class="f">dfs</span>(r, c + <span class="n">1</span>); <span class="f">dfs</span>(r + <span class="n">1</span>, c)
        <span class="f">dfs</span>(r, c - <span class="n">1</span>); <span class="f">dfs</span>(r - <span class="n">1</span>, c)

    <span class="k">for</span> r <span class="k">in</span> <span class="f">range</span>(m):
        <span class="k">for</span> c <span class="k">in</span> <span class="f">range</span>(n):
            <span class="k">if</span> grid[r][c] == <span class="s">"1"</span>:
                count += <span class="n">1</span>
                <span class="f">dfs</span>(r, c)
    <span class="k">return</span> count</pre></div>
