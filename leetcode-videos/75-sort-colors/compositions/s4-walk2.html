<template>
  <style>
    #root { position: absolute; inset: 0; }
  </style>
  <div id="root" data-composition-id="s4-walk2" data-width="1920" data-height="1080"
       data-composition-variables='[{"id":"T","type":"number","label":"Scene length (s)","default":17},{"id":"S","type":"number","label":"Narration length (s)","default":16.4}]'>
    <canvas id="s4-canvas" class="lc-fill"></canvas>
    <div class="lc-header"><span class="lc-badge">LeetCode 75</span><span class="lc-title">Sort Colors</span><span class="lc-diff lc-medium">Medium</span></div>
    <div class="mp-vals">
      <div class="mp-box sc-lo" id="s4-blo"><h4>LO</h4><div class="lc-value" id="s4-vlo"></div></div>
      <div class="mp-box sc-mid" id="s4-bmid"><h4>MID</h4><div class="lc-value" id="s4-vmid"></div></div>
      <div class="mp-box sc-hi" id="s4-bhi"><h4>HI</h4><div class="lc-value" id="s4-vhi"></div></div>
    </div>
    <div class="mp-calc"><div class="lc-panel" id="s4-p">
      <div class="mp-l" id="s4-l1">mid = <b>0</b> → swap(lo, mid), lo++ mid++</div>
      <div class="mp-l" id="s4-l2">mid = <b>2</b> → swap(mid, hi), hi--</div>
      <div class="mp-l" id="s4-l3">nums = <b>[0, 0, 1, 1, 2, 2]</b></div>
    </div></div>
  </div>
  <script>
    (function () {
      const { T, S = T } = window.__hyperframes.getVariables();
      const tl = gsap.timeline({ paused: true });
      const fade = (sel, at, from = { y: 24 }) => tl.fromTo(sel, { opacity: 0, ...from }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.45, ease: "power3.out" }, at);
      ["#s4-blo","#s4-bmid","#s4-bhi"].forEach((s) => tl.set(s, { opacity: 1 }, 0));
      const flag = Flag(document.getElementById("s4-canvas"), [0, 0, 2, 1, 1, 2]);
      Flag.vals(tl, "#s4-vlo", "1", [["2", 0.22 * S]]);
      Flag.vals(tl, "#s4-vmid", "1", [["2", 0.22 * S]]);
      Flag.vals(tl, "#s4-vhi", "4", [["3", 0.9 * S]]);
      fade("#s4-p", 0.02 * S); fade("#s4-l1", 0.03 * S); fade("#s4-l2", 0.33 * S); fade("#s4-l3", 0.59 * S);
      LC.drive(tl, T, (t) => flag.draw({ t, swaps: [[0.08 * S, 1, 1], [0.4 * S, 2, 4]], zones: 1,
        lo: Flag.track(t, [[0, 1], [0.22 * S, 2]]), mid: Flag.track(t, [[0, 1], [0.22 * S, 2]]), hi: Flag.track(t, [[0, 4], [0.9 * S, 3]]),
        orbit: 0.08 * Math.sin((t / T) * Math.PI) }));
      window.__timelines["s4-walk2"] = tl;
    })();
  </script>
</template>
