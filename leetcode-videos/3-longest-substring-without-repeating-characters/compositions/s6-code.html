<template>
  <style>
    #root { position: absolute; inset: 0; }
    .lc-title { font-size: 36px; }
    #s6-panel { top: 230px; bottom: 300px; } #s6-panel pre { font-size: 32px; }
  </style>
  <div id="root" data-composition-id="s6-code" data-width="1920" data-height="1080"
       data-composition-variables='[{"id":"T","type":"number","label":"Scene length (s)","default":24},{"id":"S","type":"number","label":"Narration length (s)","default":23.3}]'>
    <div class="lc-header"><span class="lc-badge">LeetCode 3</span><span class="lc-title">Longest Substring Without Repeating Characters</span><span class="lc-diff lc-medium">Medium</span></div>
    <div class="lc-code" id="s6-panel" data-hold><pre><div class="lc-hl" id="s6-hl"></div><span class="k">def</span> <span class="f">lengthOfLongestSubstring</span>(s):
    last = {}                  <span class="c"># char -&gt; last index seen</span>
    left = best = <span class="n">0</span>
    <span class="k">for</span> right, ch <span class="k">in</span> <span class="f">enumerate</span>(s):
        <span class="k">if</span> ch <span class="k">in</span> last <span class="k">and</span> last[ch] &gt;= left:
            left = last[ch] + <span class="n">1</span>    <span class="c"># jump past the repeat</span>
        last[ch] = right
        best = <span class="f">max</span>(best, right - left + <span class="n">1</span>)
    <span class="k">return</span> best</pre></div>
  </div>
  <script>
    (function () {
      const { T, S = T } = window.__hyperframes.getVariables();
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#s6-panel", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
      // [firstLine, lastLine, startFrac, endFrac] of T – 0-based lines, 42 px each
      const f = S / T;
      LC.codeHighlight(tl, T, "#s6-hl", [[1, 2, 0.04 * f, 0.4 * f], [3, 5, 0.4 * f, 0.72 * f], [6, 7, 0.72 * f, 1]], 42);
      window.__timelines["s6-code"] = tl;
    })();
  </script>
</template>
