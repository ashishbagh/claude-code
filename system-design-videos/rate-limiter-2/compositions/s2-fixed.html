<template>
  <style>
    #root { position: absolute; inset: 0; }
  </style>
  <div id="root" data-composition-id="s2-fixed" data-width="1080" data-height="1920"
       data-composition-variables='[{"id":"T","type":"number","label":"Scene length (s)","default":20.4},{"id":"S","type":"number","label":"Narration length (s)","default":19.8}]'>
    <div class="sd-top"><b>@DSALGO_AI</b></div>
    <div class="sd-part"><i class="on"></i><i></i><i></i><span>1/3 · THE PROBLEM</span></div>
    <div class="sd-rail" id="s2-rail"><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="sd-tag" id="s2-tag"><span>SLIDING WINDOW · RATE LIMITING</span></div>
    <canvas id="s2-canvas" class="lc-fill"></canvas>
    <div class="sd-frame"><i></i><i></i><i></i><i></i></div>
    <div class="sd-chip red" id="s2-chip">STEP 01 · FIXED WINDOW</div>
    <div class="sd-meta" id="s2-meta">1 counter / minute</div>
    <div class="sd-count" id="s2-cnt" style="top:1140px"><label>PASSED IN 2 SEC</label><b id="s2-n"></b></div>
  </div>
  <script>
    (function () {
      const { T, S = T } = window.__hyperframes.getVariables();
      const tl = gsap.timeline({ paused: true });
      const fade = (sel, at, from = { y: 20 }) => tl.fromTo(sel, { opacity: 0, ...from }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.4, ease: "power3.out" }, at);
      const sw = SWC(document.getElementById("s2-canvas"));
      SD.rail(tl, "#s2-rail", 1, 0, T);
      tl.set("#s2-tag", { opacity: 1 }, 0);
      fade("#s2-chip", 0.05); fade("#s2-meta", 0.1 * S);
      // 12:00:59 → four requests; 12:01:00–01 → four more
      const a = [0.30, 0.34, 0.38, 0.42].map((f) => f * S), b = [0.50, 0.54, 0.58, 0.62].map((f) => f * S);
      fade("#s2-cnt", 0.28 * S);
      SD.vals(tl, "#s2-n", "0", [...a, ...b].map((x, i) => [String(i + 1), x + 0.4]));
      tl.to("#s2-cnt", { borderColor: "#f87171", duration: 0.3 }, 0.66 * S);
      tl.to("#s2-n", { color: "#f87171", duration: 0.3 }, 0.66 * S);
      LC.drive(tl, T, (t) => sw.draw({ t, view: [712, 412],
        win: LC.prog(t, 0.05 * S, 0.6), labels: ["12:00", "12:01"],
        reqs: [...a.map((at) => ({ w: 0, f: 0.97, at, ok: true })), ...b.map((at) => ({ w: 1, f: 0.03, at, ok: true }))],
        counts: { prev: Math.min(4, a.filter((x) => t >= x + 0.4).length), curr: b.filter((x) => t >= x + 0.4).length, k: LC.prog(t, 0.1 * S, 0.4) },
        boundary: LC.prog(t, 0.66 * S, 0.4),
        strip: { status: [2, t > 0.66 * S ? 3 : 1, 0, 0, 0] } }));
      window.__timelines["s2-fixed"] = tl;
    })();
  </script>
</template>
