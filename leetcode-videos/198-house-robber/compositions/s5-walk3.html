<template>
  <style>
    #root { position: absolute; inset: 0; }
    #s5-walk3-best { left: 1250px; top: 200px; width: 470px; height: 210px; }
    #s5-walk3-dec { left: 1250px; top: 440px; width: 470px; height: 420px; }
    #s5-walk3-dec .lc-item { font-size: 28px; }
  </style>
  <div id="root" data-composition-id="s5-walk3" data-width="1920" data-height="1080"
       data-composition-variables='[{"id":"T","type":"number","label":"Scene length (s)","default":11.6}]'>
    <canvas id="s5-walk3-canvas" class="lc-fill"></canvas>
    <div class="lc-header"><span class="lc-badge">LeetCode 198</span><span class="lc-title">House Robber</span><span class="lc-diff lc-medium">Medium</span></div>
    <div class="lc-panel" id="s5-walk3-best"><div class="lc-label">Best so far</div><div class="lc-value"><span id="s5-walk3-v0">11</span><span id="s5-walk3-v1">12</span></div></div>
    <div class="lc-panel" id="s5-walk3-dec"><div class="lc-label">dp = max(skip, rob)</div><div class="lc-list"><div class="lc-item" id="s5-walk3-i0">$2: max(0, 0+2) = 2</div><div class="lc-item" id="s5-walk3-i1">$7: max(2, 0+7) = 7</div><div class="lc-item" id="s5-walk3-i2">$9: max(7, 2+9) = 11</div><div class="lc-item" id="s5-walk3-i3">$3: max(11, 7+3) = 11</div><div class="lc-item" id="s5-walk3-i4">$1: max(11, 11+1) = 12</div></div></div>
    <div class="lc-caption" id="s5-walk3-cap1"><span>House 4:  rob 11 + 1 = 12   vs   skip 11   →  12</span></div>
    <div class="lc-caption" id="s5-walk3-cap2"><span>Answer: 12  =  2 + 9 + 1</span></div>
  </div>
  <script>
    (function () {
      const { T } = window.__hyperframes.getVariables();
      const tl = gsap.timeline({ paused: true });
      const street = Street(document.getElementById("s5-walk3-canvas"));
      const EV = [[4, 0.02 * T, 0.3 * T]];   // [house, ring at, dp tile at]
      LC.values(tl, [["#s5-walk3-v0", 0 * T], ["#s5-walk3-v1", 0.3 * T]]);
      LC.listItems(tl, [["#s5-walk3-i0", 0], ["#s5-walk3-i1", 0], ["#s5-walk3-i2", 0], ["#s5-walk3-i3", 0], ["#s5-walk3-i4", 0.3 * T]]);
      LC.captions(tl, T, [["#s5-walk3-cap1", 0.03], ["#s5-walk3-cap2", 0.47]]);
      LC.drive(tl, T, (t) => {
        let current = null;
        EV.forEach(([h, c]) => { if (t >= c) current = h; });
        const dp = Street.dpAt(t, 4, EV.map(([h, c, d]) => [h, d]));
        const fin = LC.prog(t, 0.47 * T, 0.8), ringAlpha = 1 - LC.prog(t, 0.45 * T, 0.4);
        street.draw({ appear: 1, current, ringAlpha, dp, final: fin, orbit: 0.1 * Math.sin((t / T) * Math.PI) });
      });
      window.__timelines["s5-walk3"] = tl;
    })();
  </script>
</template>
