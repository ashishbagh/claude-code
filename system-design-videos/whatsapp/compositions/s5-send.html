<template>
  <style>
    #root { position: absolute; inset: 0; }
    #s5-chat { top: 450px; }
    .s5-note { position: absolute; right: 72px; top: 600px; padding: 10px 24px; border-radius: 22px; background: rgba(13, 17, 33, 0.86);
      color: var(--ink); font: 800 42px var(--font); opacity: 0; z-index: 5; }
    .s5-note em { font-style: normal; color: var(--yellow); }
  </style>
  <div id="root" data-composition-id="s5-send" data-width="1080" data-height="1920"
       data-composition-variables='[{"id":"T","type":"number","label":"Scene length (s)","default":21},{"id":"S","type":"number","label":"Narration length (s)","default":20.4}]'>
    <canvas id="s5-canvas" class="lc-fill"></canvas>
    <div class="v-vignette"></div>
    <div class="v-top"><span class="lc-badge">Send a message</span>
      <div class="v-route" id="s5-route"><span class="v-step">Priya</span><b>→</b><span class="v-step">A</span><b>→</b><span class="v-step">DB</span><b>→</b><span class="v-step">Redis</span><b>→</b><span class="v-step">B</span><b>→</b><span class="v-step">Rahul</span></div></div>
    <div class="v-chat" id="s5-chat">
      <div class="v-bubble" id="s5-b1">Hi! 👋 <small>10:42</small><span class="v-ticks" data-layout-allow-overlap><span class="t1" id="s5-tk1">✓</span><span class="t2" id="s5-tk2">✓</span></span></div>
    </div>
    <div class="s5-note" id="s5-n1"><em>✓</em> saved on server = sent</div>
    <div class="s5-note" id="s5-n2"><em>✓✓</em> reached Rahul = delivered</div>
  </div>
  <script>
    (function () {
      const { T, S = T } = window.__hyperframes.getVariables();
      const tl = gsap.timeline({ paused: true });
      const A = ChatArch(document.getElementById("s5-canvas"));
      const at = (f) => f * S;
      const G = "#22c55e", B = "#38bdf8", Y = "#facc15";
      const hops = [
        ["priya", "lb", at(0.03), 1.0, "Hi!", G], ["lb", "chatA", at(0.14), 1.0, "Hi!", G],
        ["chatA", "db", at(0.25), 1.1, "save", G],
        ["chatA", "priya", at(0.37), 1.1, "✓ sent", Y],
        ["chatA", "session", at(0.45), 0.9, "Rahul?", B], ["session", "chatA", at(0.51), 0.8, "server B", Y],
        ["chatA", "chatB", at(0.57), 1.0, "Hi!", G], ["chatB", "rahul", at(0.64), 1.2, "Hi!", G],
        ["rahul", "chatB", at(0.75), 1.0, "ack", B],
        ["chatB", "priya", at(0.84), 1.4, "✓✓", Y],
      ];
      const beats = [
        [0, ["priya", "lb"]], [at(0.14), ["lb", "chatA"]], [at(0.24), ["chatA", "db"]], [at(0.37), ["priya", "chatA"]],
        [at(0.44), ["chatA", "session"]], [at(0.56), ["chatA", "chatB"]], [at(0.64), ["chatB", "rahul"]],
        [at(0.84), ["priya", "lb", "rahul"]],
      ];
      LC.route(tl, "#s5-route", [[0, 0], [at(0.14), 1], [at(0.24), 2], [at(0.37), 0], [at(0.44), 3], [at(0.56), 4], [at(0.64), 5], [at(0.84), 0]]);
      tl.fromTo("#s5-b1", { opacity: 0, y: 40, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(2)" }, at(0.03));
      tl.fromTo("#s5-tk1", { opacity: 0, scale: 2 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3)" }, at(0.37) + 1.0);
      tl.fromTo("#s5-n1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35 }, at(0.37) + 0.6);
      tl.to("#s5-n1", { opacity: 0, duration: 0.25 }, at(0.82));
      tl.fromTo("#s5-tk2", { opacity: 0, scale: 2 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3)" }, at(0.84) + 1.3);
      tl.fromTo("#s5-n2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35 }, at(0.84) + 1.3);
      LC.drive(tl, T, (t) => {
        A.draw(Object.assign(A.spot(t, beats), {
          appear: A.base(), packets: SD.hop(t, hops), hot: SD.lit(t, hops), glow: SD.glowFrom(t, hops),
          orbit: 0.08 * Math.sin(t * 0.3),
        }));
      });
      window.__timelines["s5-send"] = tl;
    })();
  </script>
</template>
