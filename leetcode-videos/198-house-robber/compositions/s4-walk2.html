<template>
  <style>
    #root { position: absolute; inset: 0; }
    #s4-walk2-best { left: 1250px; top: 200px; width: 470px; height: 210px; }
    #s4-walk2-dec { left: 1250px; top: 440px; width: 470px; height: 420px; }
    #s4-walk2-dec .lc-item { font-size: 28px; }
  </style>
  <div id="root" data-composition-id="s4-walk2" data-width="1920" data-height="1080"
       data-composition-variables='[{"id":"T","type":"number","label":"Scene length (s)","default":14.6}]'>
    <canvas id="s4-walk2-canvas" class="lc-fill"></canvas>
    <div class="lc-header"><span class="lc-badge">LeetCode 198</span><span class="lc-title">House Robber</span><span class="lc-diff lc-medium">Medium</span></div>
    <div class="lc-panel" id="s4-walk2-best"><div class="lc-label">Best so far</div><div class="lc-value"><span id="s4-walk2-v0">7</span><span id="s4-walk2-v1">11</span></div></div>
    <div class="lc-panel" id="s4-walk2-dec"><div class="lc-label">dp = max(skip, rob)</div><div class="lc-list"><div class="lc-item" id="s4-walk2-i0">$2: max(0, 0+2) = 2</div><div class="lc-item" id="s4-walk2-i1">$7: max(2, 0+7) = 7</div><div class="lc-item" id="s4-walk2-i2">$9: max(7, 2+9) = 11</div><div class="lc-item" id="s4-walk2-i3">$3: max(11, 7+3) = 11</div></div></div>
    <div class="lc-caption" id="s4-walk2-cap1"><span>House 2:  rob 2 + 9 = 11   vs   skip 7   →  11</span></div>
    <div class="lc-caption" id="s4-walk2-cap2"><span>House 3:  rob 7 + 3 = 10   vs   skip 11   →  skip</span></div>
  </div>
  <script>
    (function () {
      const { T } = window.__hyperframes.getVariables();
      const tl = gsap.timeline({ paused: true });
      const street = Street(document.getElementById("s4-walk2-canvas"));
      const EV = [[2, 0.02 * T, 0.25 * T], [3, 0.36 * T, 0.78 * T]];   // [house, ring at, dp tile at]
      LC.values(tl, [["#s4-walk2-v0", 0 * T], ["#s4-walk2-v1", 0.25 * T]]);
      LC.listItems(tl, [["#s4-walk2-i0", 0], ["#s4-walk2-i1", 0], ["#s4-walk2-i2", 0.25 * T], ["#s4-walk2-i3", 0.78 * T]]);
      LC.captions(tl, T, [["#s4-walk2-cap1", 0.03], ["#s4-walk2-cap2", 0.36]]);
      LC.drive(tl, T, (t) => {
        let current = null;
        EV.forEach(([h, c]) => { if (t >= c) current = h; });
        const dp = Street.dpAt(t, 2, EV.map(([h, c, d]) => [h, d]));
        const fin = 0, ringAlpha = 1;
        street.draw({ appear: 1, current, ringAlpha, dp, final: fin, orbit: 0.1 * Math.sin((t / T) * Math.PI) });
      });
      window.__timelines["s4-walk2"] = tl;
    })();
  </script>
</template>
