<template>
  <style>
    #root { position: absolute; inset: 0; }
  </style>
  <div id="root" data-composition-id="s5-walk3" data-width="1920" data-height="1080"
       data-composition-variables='[{"id":"T","type":"number","label":"Scene length (s)","default":18},{"id":"S","type":"number","label":"Narration length (s)","default":17.4}]'>
    <canvas id="s5-canvas" class="lc-fill"></canvas>
    <div class="lc-header"><span class="lc-badge">LeetCode 75</span><span class="lc-title">Sort Colors</span><span class="lc-diff lc-medium">Medium</span></div>
    <div class="mp-vals">
      <div class="mp-box sc-lo" id="s5-blo"><h4>LO</h4><div class="lc-value" id="s5-vlo"></div></div>
      <div class="mp-box sc-mid" id="s5-bmid"><h4>MID</h4><div class="lc-value" id="s5-vmid"></div></div>
      <div class="mp-box sc-hi" id="s5-bhi"><h4>HI</h4><div class="lc-value" id="s5-vhi"></div></div>
    </div>
    <div class="mp-calc"><div class="lc-panel" id="s5-p">
      <div class="mp-l" id="s5-l1">mid = <b>1</b> → mid++ (3)</div>
      <div class="mp-l" id="s5-l2">mid = <b>1</b> → mid++ (4)</div>
      <div class="mp-chip mp-win" id="s5-l3">mid > hi → stop · sorted ✓</div>
    </div></div>
  </div>
  <script>
    (function () {
      const { T, S = T } = window.__hyperframes.getVariables();
      const tl = gsap.timeline({ paused: true });
      const fade = (sel, at, from = { y: 24 }) => tl.fromTo(sel, { opacity: 0, ...from }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.45, ease: "power3.out" }, at);
      ["#s5-blo","#s5-bmid","#s5-bhi"].forEach((s) => tl.set(s, { opacity: 1 }, 0));
      const flag = Flag(document.getElementById("s5-canvas"), [0, 0, 1, 1, 2, 2]);
      Flag.vals(tl, "#s5-vlo", "2", []);
      Flag.vals(tl, "#s5-vmid", "2", [["3", 0.1 * S], ["4", 0.28 * S]]);
      Flag.vals(tl, "#s5-vhi", "3", []);
      fade("#s5-p", 0.02 * S); fade("#s5-l1", 0.03 * S); fade("#s5-l2", 0.21 * S); fade("#s5-l3", 0.32 * S, { scale: 0.85 });
      LC.drive(tl, T, (t) => flag.draw({ t, zones: 1, win: LC.prog(t, 0.59 * S, 1.2),
        lo: 2, mid: Flag.track(t, [[0, 2], [0.1 * S, 3], [0.28 * S, 4]]), hi: 3,
        orbit: 0.1 * Math.sin((t / T) * Math.PI) }));
      window.__timelines["s5-walk3"] = tl;
    })();
  </script>
</template>
